[workspace]
resolver = "3"
members = [
    "engine",
    "doom-rs",
    "tools/wad-inspector",
    "tools/asset-inspector",
    "tools/demo-analyzer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/bejiihiu/doom-rs"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
winit = "0.30"
softbuffer = "0.4"
gilrs = "0.11"
