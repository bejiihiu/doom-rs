name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: dist/doom-rs-*.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: dist/doom-rs-*.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: dist/doom-rs-*.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # linux build compiles the engine (cpal -> ALSA, gilrs -> libudev)
      - name: Install ALSA dev libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # lockfile is tracked in git, keep the tag build reproducible
      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      # archive = binary + README + LICENSE, the whole thing users need
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pkg="doom-rs-${{ matrix.target }}"
          mkdir -p "dist/$pkg"
          cp "target/${{ matrix.target }}/release/doom-rs" "dist/$pkg/"
          cp README.md LICENSE "dist/$pkg/"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "doom-rs-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$pkg" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/doom-rs.exe" "dist/$pkg/"
          Copy-Item README.md, LICENSE "dist/$pkg/"
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          # body is pre-pended to the GitHub-generated notes, so the
          # changelog stays automatic while install info stays human
          body: |
            doom-rs ${{ github.ref_name }} — a modern rewrite of the DOOM engine in Rust.

            **Downloads:** grab the archive for your platform below and extract it. The `doom-rs` binary runs standalone; the game additionally requires a DOOM IWAD (e.g. `DOOM2.WAD`) which is not included — point the engine at it with the `-iwad` flag or an adjacent file, see the README for details.

            **Archive contents:** the engine binary, `README.md` and `LICENSE` (GPL-2.0-or-later).
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ matrix.archive }}
